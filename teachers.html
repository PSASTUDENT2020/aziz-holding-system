<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachers & Staff - Al Arqam Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-gray-50 font-sans">
    <script>checkAuth();</script>

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between shrink-0">
            <div class="p-5">
                <div class="flex items-center space-x-3 mb-6">
                    <img id="sidebar-logo" src="Academy Asset/Logo.jpg" alt="Academy Logo" class="w-9 h-9 object-contain rounded-md bg-white p-1" onerror="this.style.display='none'">
                    <h1 id="sidebar-title" class="text-lg font-bold tracking-wide truncate">Al Arqam Academy</h1>
                </div>
                
                <nav class="space-y-1.5">
                    <a href="index.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-800">Dashboard</a>
                    <a href="students.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-800">Students</a>
                    <a href="teachers.html" class="block py-2.5 px-4 rounded bg-blue-600 text-white font-medium">Teachers</a>
                    <a href="attendance.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-800">Attendance</a>
                    <a href="fees.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-800">Fees & Receipts</a>
                    <a href="reports.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-800">Reports</a>
                    <a href="settings.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-800">Settings</a>
                </nav>
            </div>
            
            <div class="p-5 border-t border-slate-800">
                <button onclick="supabaseClient.auth.signOut().then(() => window.location.href='login.html')" class="w-full bg-red-600 text-sm py-2 rounded text-white hover:bg-red-700">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-8">
            <header class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">Teachers & Faculty Directory</h2>
                    <p class="text-sm text-gray-500">Manage teaching staff, assigned classes, and contact records.</p>
                </div>
                <button onclick="openTeacherModal()" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 font-medium">+ Add Teacher</button>
            </header>

            <!-- Filters -->
            <div class="flex gap-4 mb-6">
                <input type="text" id="search-input" onkeyup="fetchTeachers()" placeholder="Search by name, ID, or subject..." class="p-2 border rounded-md w-72 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                <select id="status-filter" onchange="fetchTeachers()" class="p-2 border rounded-md text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">All Statuses</option>
                    <option value="Active">Active</option>
                    <option value="On Leave">On Leave</option>
                    <option value="Resigned">Resigned</option>
                </select>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-100 text-xs font-semibold text-gray-600 uppercase">
                        <tr>
                            <th class="p-4">Staff ID</th>
                            <th class="p-4">Name</th>
                            <th class="p-4">Designation</th>
                            <th class="p-4">Assigned Subject / Class</th>
                            <th class="p-4">Contact</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="teacher-table-body" class="divide-y divide-gray-200 text-sm">
                        <!-- Dynamic Records -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Form -->
    <div id="teacher-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg w-full max-w-lg p-6 space-y-4">
            <h3 class="text-xl font-bold text-gray-800">Add Faculty Member</h3>
            <form id="teacher-form" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Teacher ID *</label>
                        <input type="text" id="teacher_id" placeholder="e.g. TCH-01" required class="w-full p-2 border rounded mt-1 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Full Name *</label>
                        <input type="text" id="name" required class="w-full p-2 border rounded mt-1 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Designation</label>
                        <input type="text" id="designation" placeholder="e.g. Senior Teacher" class="w-full p-2 border rounded mt-1 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Qualification</label>
                        <input type="text" id="qualification" placeholder="e.g. B.Ed, M.Sc" class="w-full p-2 border rounded mt-1 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Assigned Subject</label>
                        <input type="text" id="assigned_subject" placeholder="e.g. Mathematics" class="w-full p-2 border rounded mt-1 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Assigned Class</label>
                        <input type="text" id="assigned_class" placeholder="e.g. Class 5" class="w-full p-2 border rounded mt-1 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">WhatsApp Phone *</label>
                        <input type="text" id="phone" required placeholder="e.g. 923104241477" class="w-full p-2 border rounded mt-1 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Monthly Salary</label>
                        <input type="number" id="monthly_salary" placeholder="0" class="w-full p-2 border rounded mt-1 text-sm">
                    </div>
                </div>
                <div class="flex justify-end space-x-2 pt-4 border-t">
                    <button type="button" onclick="closeTeacherModal()" class="px-4 py-2 border rounded text-gray-600 text-sm">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm font-semibold">Save Staff</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let schoolSettings = {};

        async function init() {
            const { data } = await supabaseClient.from('school_settings').select('*').eq('id', 1).single();
            if (data) {
                schoolSettings = data;
                document.getElementById('sidebar-title').innerText = data.school_name || 'Al Arqam Academy';
                if (data.logo_data && data.logo_data.trim() !== '') {
                    document.getElementById('sidebar-logo').src = data.logo_data;
                }
            }
            fetchTeachers();
        }

        async function fetchTeachers() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;

            let req = supabaseClient.from('teachers').select('*').order('created_at', { ascending: false });
            if (statusFilter) req = req.eq('status', statusFilter);

            const { data } = await req;
            const tbody = document.getElementById('teacher-table-body');
            tbody.innerHTML = '';

            if (data) {
                const filtered = data.filter(t => 
                    t.name.toLowerCase().includes(query) || 
                    t.teacher_id.toLowerCase().includes(query) || 
                    (t.assigned_subject && t.assigned_subject.toLowerCase().includes(query))
                );

                filtered.forEach(t => {
                    let badgeClass = 'bg-green-100 text-green-800';
                    if (t.status === 'On Leave') badgeClass = 'bg-yellow-100 text-yellow-800';
                    else if (t.status === 'Resigned') badgeClass = 'bg-red-100 text-red-800';

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="p-4 font-mono text-xs font-semibold text-gray-600">${t.teacher_id}</td>
                        <td class="p-4 font-medium text-gray-900">${t.name}</td>
                        <td class="p-4 text-gray-600">${t.designation || 'Teacher'}</td>
                        <td class="p-4 text-gray-600">${t.assigned_subject || 'N/A'} ${t.assigned_class ? '(' + t.assigned_class + ')' : ''}</td>
                        <td class="p-4 text-gray-600 font-mono text-xs">${t.phone}</td>
                        <td class="p-4"><span class="px-2 py-1 rounded-full text-xs font-medium ${badgeClass}">${t.status}</span></td>
                        <td class="p-4 text-center space-x-2">
                            <button onclick="sendWhatsApp('${t.phone}', '${t.name}')" class="bg-emerald-600 text-white text-xs px-2.5 py-1 rounded hover:bg-emerald-700">WhatsApp</button>
                            <button onclick="deleteTeacher('${t.id}')" class="bg-red-600 text-white text-xs px-2.5 py-1 rounded hover:bg-red-700">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }
        }

        function sendWhatsApp(phone, name) {
            if (!phone) {
                alert('No phone number available.');
                return;
            }
            const cleanPhone = phone.replace(/[^0-9]/g, '');
            const msg = encodeURIComponent(`ACADEMY NOTICE - ${schoolSettings.school_name || 'Al Arqam Academy'}\nDear ${name},\n`);
            window.open(`https://wa.me/${cleanPhone}?text=${msg}`, '_blank');
        }

        document.getElementById('teacher-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                teacher_id: document.getElementById('teacher_id').value,
                name: document.getElementById('name').value,
                designation: document.getElementById('designation').value || 'Teacher',
                qualification: document.getElementById('qualification').value,
                assigned_subject: document.getElementById('assigned_subject').value,
                assigned_class: document.getElementById('assigned_class').value,
                phone: document.getElementById('phone').value,
                monthly_salary: parseFloat(document.getElementById('monthly_salary').value) || 0,
                status: 'Active'
            };

            const { error } = await supabaseClient.from('teachers').insert([payload]);
            if (error) {
                alert('Error: ' + error.message);
            } else {
                closeTeacherModal();
                fetchTeachers();
            }
        });

        async function deleteTeacher(id) {
            if (confirm('Delete this staff record?')) {
                await supabaseClient.from('teachers').delete().eq('id', id);
                fetchTeachers();
            }
        }

        function openTeacherModal() { document.getElementById('teacher-modal').classList.remove('hidden'); document.getElementById('teacher-modal').classList.add('flex'); }
        function closeTeacherModal() { document.getElementById('teacher-modal').classList.add('hidden'); document.getElementById('teacher-modal').classList.remove('flex'); }

        init();
    </script>
</body>
</html>
