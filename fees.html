        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-8">
            <header class="flex justify-between items-center mb-6 bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm no-print">
                <div>
                    <h2 class="text-2xl font-black text-slate-900 tracking-tight">Fee Collection Ledger</h2>
                    <p class="text-xs font-medium text-slate-500 mt-1">Record payments, generate printable receipts, and trigger WhatsApp alerts.</p>
                </div>
                <button onclick="openFeeModal()" class="bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-md transition">
                    + Record Fee Payment
                </button>
            </header>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 text-[11px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-100">
                        <tr>
                            <th class="p-4">Receipt #</th>
                            <th class="p-4">Student</th>
                            <th class="p-4">Fee Month</th>
                            <th class="p-4">Total</th>
                            <th class="p-4">Paid</th>
                            <th class="p-4">Pending</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="fee-table-body" class="divide-y divide-slate-100 text-sm"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modals & Scripts remain standard -->
    <script>
        let schoolSettings = {};
        let studentMap = {};

        async function init() {
            const { data } = await supabaseClient.from('school_settings').select('*').eq('id', 1).single();
            if (data) {
                schoolSettings = data;
                document.getElementById('sidebar-title').innerText = data.school_name || 'Al Arqam Academy';
            }
            await loadStudentsDropdown();
            fetchFees();
        }

        async function loadStudentsDropdown() {
            const { data } = await supabaseClient.from('students').select('*');
            const select = document.getElementById('student_select');
            if (select) {
                select.innerHTML = '<option value="">Select Student...</option>';
                if (data) {
                    data.forEach(s => {
                        studentMap[s.id] = s;
                        const opt = document.createElement('option');
                        opt.value = s.id;
                        opt.innerText = `${s.name} (${s.student_id}) - Class ${s.class}`;
                        select.appendChild(opt);
                    });
                }
            }
        }

        async function fetchFees() {
            const { data } = await supabaseClient.from('student_fees').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('fee-table-body');
            tbody.innerHTML = '';

            if (data) {
                data.forEach(f => {
                    const student = studentMap[f.student_id] || {};
                    const curr = schoolSettings.currency || 'PKR';
                    
                    let badgeClass = 'bg-slate-100 text-slate-800 border-slate-200';
                    if (f.status === 'Paid') badgeClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                    else if (f.status === 'Partially Paid') badgeClass = 'bg-amber-50 text-amber-700 border-amber-200';
                    else if (f.status === 'Pending' || f.status === 'Overdue') badgeClass = 'bg-rose-50 text-rose-700 border-rose-200';

                    const row = document.createElement('tr');
                    row.className = "hover:bg-slate-50/80 transition";
                    row.innerHTML = `
                        <td class="p-4 font-mono text-xs font-bold text-slate-500">${f.receipt_no}</td>
                        <td class="p-4 font-bold text-slate-900">${f.student_name}</td>
                        <td class="p-4 text-slate-600 font-medium">${f.fee_month}</td>
                        <td class="p-4 font-mono font-semibold">${curr} ${f.total_fee}</td>
                        <td class="p-4 font-mono text-emerald-600 font-bold">${curr} ${f.paid_amount}</td>
                        <td class="p-4 font-mono text-rose-600 font-bold">${curr} ${f.pending_amount}</td>
                        <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-bold border ${badgeClass}">${f.status}</span></td>
                        <td class="p-4 text-center space-x-1">
                            <button onclick="viewReceipt('${f.receipt_no}', '${f.student_custom_id}', '${f.student_name}', '${f.fee_month}', ${f.total_fee}, ${f.paid_amount}, ${f.pending_amount}, '${f.payment_date}')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-2.5 py-1.5 rounded-lg font-bold shadow-xs transition">Receipt</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }
        }

        init();
    </script>
</body>
