<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - Al Arqam Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-gray-50 font-sans">
    <script>checkAuth();</script>

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between shrink-0">
            <div class="p-5">
                <div class="flex items-center space-x-3 mb-6">
                    <img id="sidebar-logo" src="Academy Asset/Logo.jpg" alt="Academy Logo" class="w-9 h-9 object-contain rounded-md bg-white p-1" onerror="this.style.display='none'">
                    <h1 id="sidebar-title" class="text-lg font-bold tracking-wide truncate">Al Arqam Academy</h1>
                </div>
                
                <nav class="space-y-1.5">
                    <a href="index.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-800">Dashboard</a>
                    <a href="students.html" class="block py-2.5 px-4 rounded bg-blue-600 text-white font-medium">Students</a>
                    <a href="teachers.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-800">Teachers</a>
                    <a href="attendance.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-800">Attendance</a>
                    <a href="fees.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-800">Fees & Receipts</a>
                    <a href="reports.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-800">Reports</a>
                    <a href="settings.html" class="block py-2.5 px-4 rounded text-slate-300 hover:bg-slate-800">Settings</a>
                </nav>
            </div>
            
            <div class="p-5 border-t border-slate-800">
                <button onclick="supabaseClient.auth.signOut().then(() => window.location.href='login.html')" class="w-full bg-red-600 text-sm py-2 rounded text-white hover:bg-red-700">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-8">
            <header class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">Student Directory</h2>
                    <p class="text-sm text-gray-500">Manage records and send parent WhatsApp updates.</p>
                </div>
                <button onclick="openModal()" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 font-medium">+ Add Student</button>
            </header>

            <!-- Filters -->
            <div class="flex gap-4 mb-6">
                <input type="text" id="search-input" onkeyup="fetchStudents()" placeholder="Search by name, ID, or phone..." class="p-2 border rounded-md w-72 outline-none focus:ring-2 focus:ring-blue-500">
                <select id="class-filter" onchange="fetchStudents()" class="p-2 border rounded-md outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">All Classes</option>
                    <option value="Nursery">Nursery</option>
                    <option value="Prep">Prep</option>
                    <option value="Class 1">Class 1</option>
                    <option value="Class 2">Class 2</option>
                    <option value="Class 3">Class 3</option>
                    <option value="Class 4">Class 4</option>
                    <option value="Class 5">Class 5</option>
                </select>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-100 text-xs font-semibold text-gray-600 uppercase">
                        <tr>
                            <th class="p-4">ID</th>
                            <th class="p-4">Name</th>
                            <th class="p-4">Class</th>
                            <th class="p-4">Parent / Guardian</th>
                            <th class="p-4">WhatsApp</th>
                            <th class="p-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body" class="divide-y divide-gray-200 text-sm">
                        <!-- Dynamic content -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Form -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-lg w-full max-w-lg p-6 space-y-4">
            <h3 class="text-xl font-bold text-gray-800">Add Student</h3>
            <form id="student-form" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Student ID *</label>
                        <input type="text" id="student_id" required class="w-full p-2 border rounded mt-1">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Full Name *</label>
                        <input type="text" id="name" required class="w-full p-2 border rounded mt-1">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Class *</label>
                        <input type="text" id="class_name" required class="w-full p-2 border rounded mt-1">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Section</label>
                        <input type="text" id="section" class="w-full p-2 border rounded mt-1">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Parent Name</label>
                        <input type="text" id="parent_name" class="w-full p-2 border rounded mt-1">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">WhatsApp Phone *</label>
                        <input type="text" id="whatsapp" required placeholder="e.g. 923104241477" class="w-full p-2 border rounded mt-1">
                    </div>
                </div>
                <div class="flex justify-end space-x-2 pt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded text-gray-600">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save Student</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let schoolSettings = {};

        async function init() {
            const { data } = await supabaseClient.from('school_settings').select('*').eq('id', 1).single();
            if (data) {
                schoolSettings = data;
                document.getElementById('sidebar-title').innerText = data.school_name || 'Al Arqam Academy';
                if (data.logo_data && data.logo_data.trim() !== '') {
                    document.getElementById('sidebar-logo').src = data.logo_data;
                }
            }
            fetchStudents();
        }

        async function fetchStudents() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const classVal = document.getElementById('class-filter').value;

            let req = supabaseClient.from('students').select('*').order('created_at', { ascending: false });
            if (classVal) req = req.eq('class', classVal);

            const { data } = await req;
            const tbody = document.getElementById('student-table-body');
            tbody.innerHTML = '';

            if (data) {
                const filtered = data.filter(s => 
                    s.name.toLowerCase().includes(query) || 
                    s.student_id.toLowerCase().includes(query) || 
                    s.whatsapp.includes(query)
                );

                filtered.forEach(s => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="p-4 font-mono text-xs font-semibold text-gray-600">${s.student_id}</td>
                        <td class="p-4 font-medium text-gray-900">${s.name}</td>
                        <td class="p-4 text-gray-600">${s.class} ${s.section ? '(' + s.section + ')' : ''}</td>
                        <td class="p-4 text-gray-600">${s.parent_name || 'N/A'}</td>
                        <td class="p-4 text-gray-600">${s.whatsapp}</td>
                        <td class="p-4 space-x-2">
                            <button onclick="sendWhatsApp('${s.whatsapp}', '${s.name}')" class="bg-emerald-600 text-white text-xs px-2.5 py-1 rounded hover:bg-emerald-700">WhatsApp</button>
                            <button onclick="deleteStudent('${s.id}')" class="bg-red-600 text-white text-xs px-2.5 py-1 rounded hover:bg-red-700">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }
        }

        function sendWhatsApp(phone, studentName) {
            if (!phone) {
                alert("No WhatsApp number provided.");
                return;
            }
            const cleanPhone = phone.replace(/[^0-9]/g, '');
            const msg = encodeURIComponent(`ACADEMY NOTICE - ${schoolSettings.school_name || 'Al Arqam Academy'}\nDear Parent,\nThis is regarding student: ${studentName}.\nPhone: ${schoolSettings.phone || ''}`);
            window.open(`https://wa.me/${cleanPhone}?text=${msg}`, '_blank');
        }

        document.getElementById('student-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                student_id: document.getElementById('student_id').value,
                name: document.getElementById('name').value,
                class: document.getElementById('class_name').value,
                section: document.getElementById('section').value,
                parent_name: document.getElementById('parent_name').value,
                whatsapp: document.getElementById('whatsapp').value
            };

            const { error } = await supabaseClient.from('students').insert([payload]);
            if (error) {
                alert('Error: ' + error.message);
            } else {
                closeModal();
                fetchStudents();
            }
        });

        async function deleteStudent(id) {
            if (confirm('Delete this student record?')) {
                await supabaseClient.from('students').delete().eq('id', id);
                fetchStudents();
            }
        }

        function openModal() { document.getElementById('modal').classList.remove('hidden'); document.getElementById('modal').classList.add('flex'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); document.getElementById('modal').classList.remove('flex'); }

        init();
    </script>
</body>
</html>
