<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - Al Arqam Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">
    <script>checkAuth();</script>

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between shrink-0 shadow-xl border-r border-slate-800">
            <div class="p-5">
                <div class="flex items-center space-x-3 mb-8 bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
                    <img id="sidebar-logo" src="Academy Asset/Logo.jpg" alt="Academy Logo" class="w-10 h-10 object-contain rounded-lg bg-white p-1 shadow-md" onerror="this.style.display='none'">
                    <div>
                        <h1 id="sidebar-title" class="text-base font-bold tracking-wide text-white truncate max-w-[130px]">Al Arqam Academy</h1>
                        <span class="text-[10px] text-emerald-400 font-semibold bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">Active Portal</span>
                    </div>
                </div>
                
                <nav class="space-y-1.5">
                    <a href="index.html" class="flex items-center space-x-3 py-2.5 px-4 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                        <span>Dashboard</span>
                    </a>
                    <a href="students.html" class="flex items-center space-x-3 py-2.5 px-4 rounded-lg bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-medium shadow-md">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        <span>Students</span>
                    </a>
                    <a href="teachers.html" class="flex items-center space-x-3 py-2.5 px-4 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                        <span>Teachers</span>
                    </a>
                    <a href="courses.html" class="flex items-center space-x-3 py-2.5 px-4 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                        <span>Courses & Classes</span>
                    </a>
                    <a href="attendance.html" class="flex items-center space-x-3 py-2.5 px-4 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                        <span>Attendance</span>
                    </a>
                    <a href="fees.html" class="flex items-center space-x-3 py-2.5 px-4 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        <span>Fees & Receipts</span>
                    </a>
                    <a href="reports.html" class="flex items-center space-x-3 py-2.5 px-4 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                        <span>Reports</span>
                    </a>
                    <a href="settings.html" class="flex items-center space-x-3 py-2.5 px-4 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                        <span>Settings</span>
                    </a>
                </nav>
            </div>
            
            <div class="p-5 border-t border-slate-800 bg-slate-950/40">
                <button onclick="supabaseClient.auth.signOut().then(() => window.location.href='login.html')" class="w-full bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/30 text-xs py-2.5 rounded-lg transition font-medium">Sign Out</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-8">
            <header class="flex justify-between items-center mb-6 bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
                <div>
                    <h2 class="text-2xl font-black text-slate-900 tracking-tight">Student Directory</h2>
                    <p class="text-xs font-medium text-slate-500 mt-1">Manage active enrollments and dispatch parent notices.</p>
                </div>
                <button onclick="openModal()" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-md transition flex items-center space-x-2">
                    <span>+ Add Student</span>
                </button>
            </header>

            <!-- Filters -->
            <div class="flex gap-4 mb-6">
                <input type="text" id="search-input" onkeyup="fetchStudents()" placeholder="Search student name, ID, or phone..." class="p-3 border border-slate-200 rounded-xl w-80 text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-xs">
                
                <!-- Searchable Class Dropdown Component -->
                <div class="relative w-64" id="class-dropdown-wrapper">
                    <input type="hidden" id="class-filter" value="">
                    <button type="button" onclick="toggleClassDropdown()" id="class-dropdown-btn" class="w-full p-3 border border-slate-200 rounded-xl text-sm font-medium bg-white flex justify-between items-center focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-xs">
                        <span id="class-dropdown-label" class="truncate text-slate-700">All Classes</span>
                        <svg class="w-4 h-4 text-slate-400 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    
                    <div id="class-dropdown-menu" class="hidden absolute z-30 mt-1 w-full bg-white border border-slate-200 rounded-xl shadow-xl overflow-hidden">
                        <div class="p-2 border-b border-slate-100 bg-slate-50">
                            <input type="text" id="class-search-input" onkeyup="filterClassOptions()" placeholder="Search class..." class="w-full p-2 border border-slate-200 rounded-lg text-xs bg-white outline-none focus:border-blue-500">
                        </div>
                        <ul id="class-dropdown-options" class="max-h-48 overflow-y-auto text-sm divide-y divide-slate-50">
                            <!-- Options dynamically injected -->
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 text-[11px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-100">
                        <tr>
                            <th class="p-4">Student ID</th>
                            <th class="p-4">Full Name</th>
                            <th class="p-4">Grade Class</th>
                            <th class="p-4">Parent / Guardian</th>
                            <th class="p-4">WhatsApp Contact</th>
                            <th class="p-4 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body" class="divide-y divide-slate-100 text-sm">
                        <!-- Dynamic Content -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Form -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl w-full max-w-lg p-6 space-y-4 shadow-2xl border border-slate-100">
            <h3 class="text-xl font-bold text-slate-800">Enroll New Student</h3>
            <form id="student-form" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600">Student ID *</label>
                        <input type="text" id="student_id" required class="w-full p-2.5 border border-slate-200 rounded-lg mt-1 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600">Full Name *</label>
                        <input type="text" id="name" required class="w-full p-2.5 border border-slate-200 rounded-lg mt-1 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600">Class *</label>
                        <input type="text" id="class_name" required class="w-full p-2.5 border border-slate-200 rounded-lg mt-1 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600">Section</label>
                        <input type="text" id="section" class="w-full p-2.5 border border-slate-200 rounded-lg mt-1 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600">Parent Name</label>
                        <input type="text" id="parent_name" class="w-full p-2.5 border border-slate-200 rounded-lg mt-1 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600">WhatsApp Phone *</label>
                        <input type="text" id="whatsapp" required placeholder="e.g. 923104241477" class="w-full p-2.5 border border-slate-200 rounded-lg mt-1 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="flex justify-end space-x-2 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg text-slate-600 text-sm font-medium">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-bold shadow-md">Save Record</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let schoolSettings = {};
        let availableClasses = [];

        async function init() {
            const { data } = await supabaseClient.from('school_settings').select('*').eq('id', 1).single();
            if (data) {
                schoolSettings = data;
                document.getElementById('sidebar-title').innerText = data.school_name || 'Al Arqam Academy';
                if (data.logo_data && data.logo_data.trim() !== '') {
                    document.getElementById('sidebar-logo').src = data.logo_data;
                }
            }
            await populateClassDropdown();
            fetchStudents();
        }

        // Searchable Dropdown Logic
        async function populateClassDropdown() {
            const { data: classesData } = await supabaseClient.from('classes').select('class_name');
            const fallbackClasses = ["Nursery", "Prep", "Class 1", "Class 2", "Class 3", "Class 4", "Class 5"];
            
            if (classesData && classesData.length > 0) {
                availableClasses = Array.from(new Set(classesData.map(c => c.class_name))).sort();
            } else {
                availableClasses = fallbackClasses;
            }

            renderClassOptions(availableClasses);
        }

        function renderClassOptions(classesList) {
            const listContainer = document.getElementById('class-dropdown-options');
            listContainer.innerHTML = '';

            // Default 'All Classes' option
            const defaultLi = document.createElement('li');
            defaultLi.className = "px-4 py-2 hover:bg-slate-100 cursor-pointer text-xs font-semibold text-slate-600 transition";
            defaultLi.innerText = "All Classes";
            defaultLi.onclick = () => selectClassOption('', 'All Classes');
            listContainer.appendChild(defaultLi);

            classesList.forEach(cls => {
                const li = document.createElement('li');
                li.className = "px-4 py-2 hover:bg-slate-100 cursor-pointer text-xs font-medium text-slate-700 transition";
                li.innerText = cls;
                li.onclick = () => selectClassOption(cls, cls);
                listContainer.appendChild(li);
            });
        }

        function toggleClassDropdown() {
            const menu = document.getElementById('class-dropdown-menu');
            menu.classList.toggle('hidden');
            if (!menu.classList.contains('hidden')) {
                document.getElementById('class-search-input').focus();
            }
        }

        function filterClassOptions() {
            const query = document.getElementById('class-search-input').value.toLowerCase();
            const filtered = availableClasses.filter(c => c.toLowerCase().includes(query));
            renderClassOptions(filtered);
        }

        function selectClassOption(val, label) {
            document.getElementById('class-filter').value = val;
            document.getElementById('class-dropdown-label').innerText = label;
            document.getElementById('class-dropdown-menu').classList.add('hidden');
            fetchStudents();
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            const wrapper = document.getElementById('class-dropdown-wrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                document.getElementById('class-dropdown-menu').classList.add('hidden');
            }
        });

        async function fetchStudents() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const classVal = document.getElementById('class-filter').value;

            let req = supabaseClient.from('students').select('*').order('created_at', { ascending: false });
            if (classVal) req = req.eq('class', classVal);

            const { data } = await req;
            const tbody = document.getElementById('student-table-body');
            tbody.innerHTML = '';

            if (data) {
                const filtered = data.filter(s => 
                    s.name.toLowerCase().includes(query) || 
                    s.student_id.toLowerCase().includes(query) || 
                    s.whatsapp.includes(query)
                );

                filtered.forEach(s => {
                    const row = document.createElement('tr');
                    row.className = "hover:bg-slate-50/80 transition";
                    row.innerHTML = `
                        <td class="p-4 font-mono text-xs font-bold text-slate-500">${s.student_id}</td>
                        <td class="p-4 font-bold text-slate-900">${s.name}</td>
                        <td class="p-4"><span class="bg-indigo-50 border border-indigo-200 text-indigo-700 px-2.5 py-1 rounded-lg text-xs font-bold">${s.class} ${s.section ? '(' + s.section + ')' : ''}</span></td>
                        <td class="p-4 text-slate-600 font-medium">${s.parent_name || 'N/A'}</td>
                        <td class="p-4 font-mono text-slate-600 text-xs">${s.whatsapp}</td>
                        <td class="p-4 text-center space-x-2">
                            <button onclick="sendWhatsApp('${s.whatsapp}', '${s.name}')" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold shadow-xs transition">WhatsApp</button>
                            <button onclick="deleteStudent('${s.id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs px-3 py-1.5 rounded-lg font-bold transition">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }
        }

        function sendWhatsApp(phone, studentName) {
            if (!phone) { alert("No WhatsApp number provided."); return; }
            const cleanPhone = phone.replace(/[^0-9]/g, '');
            const msg = encodeURIComponent(`ACADEMY NOTICE - ${schoolSettings.school_name || 'Al Arqam Academy'}\nDear Parent,\nThis notice concerns student: ${studentName}.`);
            window.open(`https://wa.me/${cleanPhone}?text=${msg}`, '_blank');
        }

        document.getElementById('student-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                student_id: document.getElementById('student_id').value,
                name: document.getElementById('name').value,
                class: document.getElementById('class_name').value,
                section: document.getElementById('section').value,
                parent_name: document.getElementById('parent_name').value,
                whatsapp: document.getElementById('whatsapp').value
            };

            const { error } = await supabaseClient.from('students').insert([payload]);
            if (error) { alert('Error: ' + error.message); } 
            else { closeModal(); fetchStudents(); }
        });

        async function deleteStudent(id) {
            if (confirm('Delete this student record?')) {
                await supabaseClient.from('students').delete().eq('id', id);
                fetchStudents();
            }
        }

        function openModal() { document.getElementById('modal').classList.remove('hidden'); document.getElementById('modal').classList.add('flex'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); document.getElementById('modal').classList.remove('flex'); }

        init();
    </script>
</body>
</html>
